<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Love Lamp</title>
<meta name="description" content="Your love lamp, from your phone: its light, hearts and photos.">
<meta name="theme-color" content="#160d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Love Lamp">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preload" as="image" href="dusk-A.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lora:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
  /* The lakeside at dusk, and your lamp's globe lighting it.  Controls are the
     lamp's own lantern glass (smoky, a fine gold rim); words are cream; Lora is
     the lamp's serif, Great Vibes its handwriting (once per screen). */
  :root {
    --night: #160d12;                       /* dusk, deep plum-brown */
    --glass: rgba(34, 21, 25, .5);          /* lantern glass */
    --glass-hi: rgba(255, 240, 225, .09);   /* a control on the glass */
    --rim: rgba(255, 208, 138, .3);         /* its fine gold edge */
    --cream: #fff1df; --cream-2: rgba(255, 241, 223, .7); --cream-3: rgba(255, 241, 223, .46);
    --ink: #2a1a14;                          /* text on cream */
    --rose: #ff7fa6; --rose-deep: #d23c72; --gold: #f4cd78;
    --glow: #ffb070; --level: .5; --lit: 1;  /* the globe: colour, brightness, on */
    --gy: 30vh;                               /* where the globe is on screen (its light spills from there) */
    --spring: cubic-bezier(.2, .9, .25, 1);
    --tabbar: calc(4rem + env(safe-area-inset-bottom));
    --serif: Lora, "Iowan Old Style", Georgia, serif;
    --hand: "Great Vibes", "Snell Roundhand", cursive;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--night); color: var(--cream);
    font: 500 1rem/1.45 -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  :focus-visible { outline: 2px solid var(--cream); outline-offset: 3px; border-radius: 12px; }

  /* ---- the scene: the world behind everything (fixed; the page scrolls over it) */
  .scene { position: fixed; inset: 0; z-index: 0; background-size: cover; background-repeat: no-repeat;
           opacity: 0; transition: opacity 1.1s ease;
           -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 18%, #000 72%, transparent 100%);
           mask-image: linear-gradient(180deg, transparent 0, #000 18%, #000 72%, transparent 100%); }
  .scene.on { opacity: 1; }
  /* on the Lamp tab the room is lit by the lamp: dim when it's off, brighter as it brightens */
  .scene { transition: opacity 1.1s ease, filter .6s ease; }
  body[data-tab="lamp"] .scene { filter: brightness(calc(.4 + .45 * var(--lit) * var(--level))) saturate(calc(.75 + .2 * var(--lit))); }
  #s-dusk-A { background-image: url(dusk-A.jpg); }
  #s-dusk-B { background-image: url(dusk-B.jpg); }
  #s-together-A { background-image: url(together-A.jpg); }
  #s-together-B { background-image: url(together-B.jpg); }
  /* the open space where the pets show through, under the lamp or the heart */
  .stage { height: clamp(7rem, 19vh, 11rem); pointer-events: none; }
  /* the globe's light, spilling over the world from where the globe is */
  .wash { position: fixed; inset: 0; z-index: 1; pointer-events: none; mix-blend-mode: screen;
          background: radial-gradient(circle at 50% var(--gy), color-mix(in srgb, var(--glow) 70%, transparent) 0,
                      color-mix(in srgb, var(--glow) 22%, transparent) 34%, transparent 66%);
          opacity: calc(var(--lit) * (.3 + .6 * var(--level))); transition: opacity .6s ease; }
  body:not([data-tab="lamp"]) .wash { opacity: 0; }
  .shade { position: fixed; inset: 0; z-index: 1; pointer-events: none;
           background: linear-gradient(180deg, rgba(14, 7, 11, .62) 0%, rgba(14, 7, 11, .1) 20%, rgba(14, 7, 11, 0) 38%,
                                       rgba(22, 13, 18, .55) 58%, rgba(22, 13, 18, .9) 78%, var(--night) 100%); }

  main {
    position: relative; z-index: 2; max-width: 27rem; margin: 0 auto; min-height: 100dvh;
    display: flex; flex-direction: column; gap: 1rem;
    padding: max(1rem, env(safe-area-inset-top)) max(1.1rem, env(safe-area-inset-right))
             calc(var(--tabbar) + 1.4rem) max(1.1rem, env(safe-area-inset-left));
  }

  /* ---- the top: a handwritten title, and who you are */
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: .75rem; }
  h1 { margin: .1rem 0 0; font: 400 2.9rem/1 var(--hand); letter-spacing: 0; color: var(--cream);
       text-shadow: 0 2px 22px rgba(0, 0, 0, .55), 0 0 30px color-mix(in srgb, var(--glow) 35%, transparent); }
  .sub { margin: .35rem 0 0 .15rem; display: flex; align-items: center; gap: .45rem; min-height: 1.2rem;
         font-size: .88rem; color: var(--cream-2); text-shadow: 0 1px 10px rgba(0, 0, 0, .6); }
  .dot { width: .45rem; height: .45rem; border-radius: 50%; background: #8a7f78; flex: none; transition: background .3s, box-shadow .3s; }
  .dot.up { background: #7fd394; box-shadow: 0 0 8px rgba(127, 211, 148, .9); }
  .dot.trying { background: var(--gold); animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .who { flex: none; margin-top: .55rem; min-height: 2.2rem; padding: 0 .85rem; border-radius: 999px;
         font-family: inherit; font-size: .82rem; font-weight: 600; line-height: 1; color: var(--cream); letter-spacing: .01em;
         background: rgba(30, 18, 22, .42); -webkit-backdrop-filter: blur(16px) saturate(150%); backdrop-filter: blur(16px) saturate(150%);
         box-shadow: inset 0 0 0 .5px var(--rim); display: inline-flex; align-items: center; gap: .4rem; }
  .who svg { width: .8rem; height: .8rem; opacity: .7; }

  /* ---- lantern glass: one material for every group of controls */
  .glass { position: relative; border-radius: 24px; padding: 1.05rem;
           background: var(--glass); -webkit-backdrop-filter: blur(26px) saturate(150%); backdrop-filter: blur(26px) saturate(150%);
           box-shadow: inset 0 0 0 .5px var(--rim), inset 0 1px 0 rgba(255, 236, 210, .14), 0 20px 50px rgba(8, 3, 6, .45);
           display: flex; flex-direction: column; gap: .85rem; }
  .label { margin: 0; font-size: .9rem; font-weight: 600; color: var(--cream-2); }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: .5rem; }
  .num { font: 500 .95rem var(--serif); color: var(--cream); font-variant-numeric: tabular-nums lining-nums; }
  .note { margin: -.35rem 0 0; font-size: .8rem; line-height: 1.4; color: var(--cream-3); }

  .panel { display: flex; flex-direction: column; gap: 1rem; animation: arrive .5s var(--spring) both; }
  @keyframes arrive { from { opacity: 0; transform: translateY(10px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }

  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  .press { transition: transform .12s ease-out, filter .12s ease-out; }
  .press:active { transform: scale(.96); filter: brightness(1.12); }

  /* buttons */
  .primary { width: 100%; min-height: 3.3rem; border-radius: 16px; font-weight: 700; font-size: 1.05rem; color: #fff8f0;
             background: linear-gradient(180deg, #ff8fb2, var(--rose-deep));
             box-shadow: 0 10px 26px rgba(210, 60, 114, .38), inset 0 1px 0 rgba(255, 255, 255, .35);
             display: inline-flex; align-items: center; justify-content: center; gap: .55rem; }
  .primary:disabled { filter: grayscale(.6) brightness(.75); box-shadow: none; cursor: default; }
  .quiet { width: 100%; min-height: 3.1rem; border-radius: 16px; font-weight: 650; color: var(--cream);
           background: var(--glass-hi); box-shadow: inset 0 0 0 .5px var(--rim);
           display: inline-flex; align-items: center; justify-content: center; gap: .55rem; }
  .quiet svg { width: 1.1rem; height: 1.1rem; color: var(--rose); }
  .spin { display: none; width: 1.05rem; height: 1.05rem; border: 2px solid rgba(255, 255, 255, .4);
          border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
  .busy .spin { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* a segmented control; the cream thumb slides to the choice */
  .seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px;
         border-radius: 14px; background: rgba(255, 240, 225, .07); box-shadow: inset 0 0 0 .5px rgba(255, 220, 180, .14); }
  .seg .thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; border-radius: 11px; opacity: 0;
                background: linear-gradient(180deg, #fff8ee, #f5e4cd); box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
                transition: transform .38s var(--spring), opacity .2s; }
  .seg button { position: relative; z-index: 1; min-height: 2.65rem; padding: 0 .25rem; font-size: .9rem; font-weight: 600;
                color: var(--cream-2); line-height: 1.15; transition: color .25s; }
  .seg button[aria-pressed="true"] { color: var(--ink); }

  input[type=password], input[type=text] {
    width: 100%; min-height: 3.1rem; padding: .8rem 1rem; border-radius: 14px; border: 0; outline: none;
    background: rgba(255, 240, 225, .08); box-shadow: inset 0 0 0 .5px var(--rim); color: var(--cream);
    font-family: inherit; font-size: max(16px, 1.0625rem); font-weight: 500; line-height: 1.2; transition: box-shadow .15s, background .15s;
  }
  input::placeholder { color: var(--cream-3); }
  input:focus { background: rgba(255, 240, 225, .12); box-shadow: inset 0 0 0 1px rgba(255, 208, 138, .7), 0 0 0 4px rgba(255, 208, 138, .12); }
  .status { min-height: 1.3rem; margin: -.3rem 0 0; text-align: center; font-size: .9rem; font-weight: 600; color: var(--cream-2); }
  .status.ok { color: #9fe0b0; }
  .status.err { color: #ff9dbb; }

  /* ---- the Lamp: its globe, on a little walnut base; the hero of the page */
  .hero { display: grid; justify-items: center; padding: 1.2rem 0 .3rem; }
  .lamp { position: relative; display: grid; justify-items: center; border-radius: 50%; }
  .halo { position: absolute; left: 50%; top: 42%; width: 21rem; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%;
          pointer-events: none; background: radial-gradient(closest-side, color-mix(in srgb, var(--glow) 75%, transparent),
                                                            color-mix(in srgb, var(--glow) 18%, transparent) 55%, transparent);
          opacity: calc(var(--lit) * (.25 + .75 * var(--level))); scale: calc(.75 + .3 * var(--level));
          transition: opacity .6s ease, scale .6s var(--spring); filter: blur(6px); }
  .globe { position: relative; width: min(11.5rem, 52vw); aspect-ratio: 1; border-radius: 50%; overflow: hidden;
           transition: box-shadow .6s ease, filter .6s ease; }
  .globe::before, .globe::after { content: ""; position: absolute; border-radius: 50%; pointer-events: none; }
  .globe::before { inset: 0; transition: opacity .6s ease;    /* the light inside: a hot core, the colour, a deeper edge */
                   background: radial-gradient(circle at 50% 52%, #fff 0%, color-mix(in srgb, var(--glow) 30%, #fff) 18%,
                               color-mix(in srgb, var(--glow) 75%, #fff) 34%, var(--glow) 56%,
                               color-mix(in srgb, var(--glow) 70%, #4a1408) 86%, color-mix(in srgb, var(--glow) 45%, #1a0408) 100%);
                   opacity: var(--lit); filter: brightness(calc(.85 + .35 * var(--level))) saturate(1.1); }
  .globe::after { inset: 5% 27% 63% 13%;                       /* the room's window, caught on the glass */
                  background: radial-gradient(ellipse at 50% 55%, rgba(255, 255, 255, .9), rgba(255, 255, 255, .25) 45%, rgba(255, 255, 255, 0) 72%);
                  rotate: -24deg; opacity: .75; }
  .globe { background: radial-gradient(circle at 46% 34%, rgba(255, 255, 255, .34), rgba(190, 176, 170, .2) 48%, rgba(46, 30, 34, .62) 100%);
           box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .3), inset 0 -20px 36px rgba(24, 6, 4, .5), inset 0 12px 26px rgba(255, 255, 255, .16),
                       0 0 calc(var(--lit) * (20px + 40px * var(--level))) calc(var(--lit) * (4px + 10px * var(--level))) color-mix(in srgb, var(--glow) 85%, transparent),
                       0 0 calc(var(--lit) * (60px + 110px * var(--level))) calc(var(--lit) * (10px + 30px * var(--level))) color-mix(in srgb, var(--glow) 45%, transparent); }
  .base { width: min(6.6rem, 30vw); height: 1.15rem; margin-top: -.35rem; border-radius: 8px 8px 12px 12px;
          background: linear-gradient(180deg, #a8714a, #6b4329 60%, #4e301d);
          box-shadow: inset 0 1px 0 rgba(255, 220, 180, .35), 0 8px 18px rgba(0, 0, 0, .45),
                      0 -4px 14px calc(var(--lit) * 2px) color-mix(in srgb, var(--glow) calc(var(--lit) * 45%), transparent); }
  .lamp:active .globe { transform: scale(.975); transition: transform .1s ease-out; }
  .caption { margin-top: 1rem; text-align: center; }
  .caption b { display: block; font: 500 1.35rem/1.2 var(--serif); color: var(--cream); text-shadow: 0 1px 12px rgba(0, 0, 0, .5); }
  .caption span { font-size: .85rem; color: var(--cream-3); }
  /* the effects, gently, on the picture of the globe (nothing at all with reduced motion) */
  .lamp[data-fx="pulse"] .globe::before { animation: breathe 2.5s ease-in-out infinite; }
  .lamp[data-fx="warm"] .globe::before { animation: breathe 8s ease-in-out infinite; }
  .lamp[data-fx="heartbeat"] .globe { animation: beat 1.1s ease-in-out infinite; }
  .lamp[data-fx="candle"] .globe::before { animation: flicker 1.9s steps(7) infinite; }
  .lamp[data-fx="aurora"] .globe::before { animation: aurora 12s linear infinite; }
  @keyframes breathe { 50% { filter: brightness(calc(.5 + .3 * var(--level))); } }
  @keyframes beat { 0%, 45%, 100% { transform: scale(1); } 10% { transform: scale(1.035); } 26% { transform: scale(1.02); } }
  @keyframes flicker { 0% { opacity: 1; } 25% { opacity: .86; } 50% { opacity: .97; } 75% { opacity: .9; } }
  @keyframes aurora { to { filter: hue-rotate(360deg) brightness(calc(.85 + .35 * var(--level))); } }

  /* brightness: a track that fills with the light, a pearl to drag */
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 2.6rem; margin: -.45rem 0; background: none; touch-action: pan-y; }
  input[type=range]::-webkit-slider-runnable-track { height: .7rem; border-radius: 999px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--glow) 25%, #3a2a2a) 0%, var(--glow) calc(var(--fill) * 100%),
                                rgba(255, 240, 225, .1) calc(var(--fill) * 100%)); }
  input[type=range]::-moz-range-track { height: .7rem; border-radius: 999px; background: rgba(255, 240, 225, .1); }
  input[type=range]::-moz-range-progress { height: .7rem; border-radius: 999px; background: var(--glow); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 1.7rem; height: 1.7rem; margin-top: -.5rem; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #fff, #f2e3cf); box-shadow: 0 2px 8px rgba(0, 0, 0, .45), 0 0 0 .5px rgba(0, 0, 0, .2); }
  input[type=range]::-moz-range-thumb { width: 1.7rem; height: 1.7rem; border: 0; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #fff, #f2e3cf); box-shadow: 0 2px 8px rgba(0, 0, 0, .45); }

  /* colours: glass beads; the last opens any colour at all */
  .beads { display: grid; grid-template-columns: repeat(4, 1fr); gap: .8rem .5rem; padding: .15rem 0; }
  .bead { position: relative; justify-self: center; width: min(3rem, 100%); aspect-ratio: 1; border-radius: 50%;
          background: radial-gradient(circle at 36% 30%, color-mix(in srgb, var(--c) 30%, #fff) 0%, var(--c) 45%, color-mix(in srgb, var(--c) 70%, #000) 100%);
          box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .3), 0 3px 8px rgba(0, 0, 0, .35); transition: box-shadow .25s; }
  .bead[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--night), 0 0 0 4px var(--cream), 0 0 18px 2px color-mix(in srgb, var(--c) 80%, transparent); }
  .bead.any { --c: #ff9fbf; background: conic-gradient(from 20deg, #ff6f6f, #ffc371, #f9f871, #7ee8a2, #6fb7ff, #b79cff, #ff6fa5, #ff6f6f); overflow: hidden; }
  .bead.any input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; padding: 0; cursor: pointer; }

  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
  .chip { min-height: 2.6rem; border-radius: 12px; font-size: .88rem; font-weight: 600; color: var(--cream-2);
          background: var(--glass-hi); box-shadow: inset 0 0 0 .5px rgba(255, 220, 180, .16); transition: color .2s, background .2s; }
  .chip[aria-pressed="true"] { color: var(--ink); background: linear-gradient(180deg, #fff8ee, #f5e4cd); box-shadow: 0 2px 8px rgba(0, 0, 0, .3); }
  .dim { opacity: .45; }

  /* ---- Love: a big rose heart, glowing; tap codes; my mood */
  .love-hero { display: grid; justify-items: center; gap: .9rem; padding: 1.4rem 0 .4rem; }
  .heart-orb { position: relative; display: grid; place-items: center; width: min(10rem, 46vw); aspect-ratio: 1; border-radius: 50%;
               background: radial-gradient(circle at 40% 32%, #ffc2d4 0%, #ff7fa6 38%, #c8215d 100%);
               box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .35), inset 0 -12px 26px rgba(90, 0, 30, .35),
                           0 0 46px 6px rgba(255, 111, 154, .45), 0 18px 40px rgba(0, 0, 0, .4);
               animation: idle-glow 5s ease-in-out infinite; }
  .heart-orb::after { content: ""; position: absolute; inset: 9% 26% 58% 20%; border-radius: 50%; rotate: -18deg;
                      background: radial-gradient(closest-side, rgba(255, 255, 255, .7), rgba(255, 255, 255, 0)); }
  .heart-orb svg { width: 42%; height: 42%; color: #fff6f8; filter: drop-shadow(0 3px 8px rgba(110, 0, 40, .45)); }
  .heart-orb.sent svg { animation: thump .55s var(--spring); }
  @keyframes thump { 30% { transform: scale(1.22); } }
  @keyframes idle-glow { 50% { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .35), inset 0 -12px 26px rgba(90, 0, 30, .35),
                                           0 0 64px 12px rgba(255, 111, 154, .55), 0 18px 40px rgba(0, 0, 0, .4); } }
  .love-hero .caption { margin-top: 0; }

  .codes { display: grid; gap: .5rem; }
  .code { display: flex; align-items: center; justify-content: space-between; min-height: 3.1rem; padding: 0 1rem; border-radius: 14px;
          background: var(--glass-hi); box-shadow: inset 0 0 0 .5px rgba(255, 220, 180, .16); font: 500 1.05rem var(--serif); color: var(--cream); }
  .code .taps { display: flex; gap: .32rem; }
  .code .taps i { width: .5rem; height: .5rem; border-radius: 50%; background: var(--rose); box-shadow: 0 0 8px rgba(255, 127, 166, .8); }
  .code.playing .taps i { animation: tap .65s ease-out both; animation-delay: calc(var(--i) * .65s); }
  @keyframes tap { 0% { transform: scale(1); } 25% { transform: scale(1.8); background: #fff; } 100% { transform: scale(1); } }

  .moods { display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem .5rem; }
  .mood { display: grid; justify-items: center; gap: .4rem; padding: .2rem 0; font-size: .8rem; font-weight: 600; color: var(--cream-2); }
  .mood i { width: 2.4rem; aspect-ratio: 1; border-radius: 50%; transition: box-shadow .25s;
            background: radial-gradient(circle at 36% 30%, color-mix(in srgb, var(--c) 30%, #fff), var(--c) 45%, color-mix(in srgb, var(--c) 65%, #000));
            box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .3), 0 0 14px color-mix(in srgb, var(--c) 55%, transparent); }
  .mood.clear i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--cream-3); }
  .mood[aria-pressed="true"] { color: var(--cream); }
  .mood[aria-pressed="true"] i { box-shadow: 0 0 0 2px var(--night), 0 0 0 4px var(--cream), 0 0 22px 4px color-mix(in srgb, var(--c) 70%, transparent); }

  /* ---- Photo: a polaroid, like the one by the pet on the lamp, your note in ink */
  .polaroid { position: relative; display: block; width: min(100%, 22rem); margin: 1rem auto .2rem; padding: .7rem .7rem 0;
              background: linear-gradient(180deg, #fffdf8, #f3ede2); border-radius: 4px; rotate: -2.2deg; cursor: pointer;
              box-shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 22px 48px rgba(0, 0, 0, .5); transition: rotate .45s var(--spring), transform .12s ease-out; }
  .polaroid:active { transform: scale(.98); }
  .polaroid.has { rotate: -1deg; }
  .polaroid input[type=file] { display: none; }
  .print { position: relative; display: grid; place-items: center; aspect-ratio: 3 / 2; overflow: hidden; border-radius: 2px;
           background: radial-gradient(circle at 50% 40%, #3b2a2c, #1f1416); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .25); }
  .print .empty { display: grid; justify-items: center; gap: .45rem; text-align: center; color: rgba(255, 241, 223, .8); font-weight: 600; }
  .print .empty svg { width: 2.2rem; height: 2.2rem; color: var(--rose); }
  .print .empty small { font-weight: 500; font-size: .8rem; color: rgba(255, 241, 223, .5); }
  .print canvas { display: none; width: 100%; height: 100%; object-fit: contain; }
  .polaroid.has canvas { display: block; }
  .polaroid.has .empty { display: none; }
  .ink { display: block; min-height: 3.6rem; padding: .55rem .4rem .7rem; text-align: center; overflow-wrap: anywhere;
         font: 400 1.9rem/1.05 var(--hand); color: #3a2a6a; }
  .ink.blank { color: rgba(58, 42, 106, .32); }

<script>
// Love Lamp, from your phone.  Everything goes through the lamps' broker
// (MQTT over secure WebSocket) on the lamps' photo topics, the only ones this
// page's login may use:
//   - photos go to the OTHER person's lamp (and a quiet copy to your own, so
//     both keep the whole album);
//   - the light, hearts, tap codes and moods go to YOUR OWN lamp ("ctl"),
//     which does them just as if its own screen were tapped.
// The page holds no password: the passcode is asked once and kept on this
// phone.  It's connected only while it's open in front of you.
const BROKER = "wss://w7f280b2.ala.us-east-1.emqxsl.com:8084/mqtt";
const PAIR = "ll-41205afa9e";
const USER = "lamp-photos";
const NAMES = { A: "Benji", B: "Julie" };
const PETS = { A: "pup", B: "kitten" };
const MAX_BYTES = 60000;
const COLORS = [
  ["Warm white", "#ffb070"], ["Candle", "#ff8a3c"], ["Peach", "#ff9e7a"], ["Rose", "#ff6fa5"],
  ["Lavender", "#b79cff"], ["Sky", "#6fb7ff"], ["Moonlight", "#ffe9cf"],
];
const EFFECTS = [
  ["solid", "Steady"], ["warm", "Warm glow"], ["pulse", "Soft pulse"],
  ["candle", "Candle"], ["aurora", "Aurora"], ["heartbeat", "Heartbeat"],
];
const CODES = [[3, "I love you"], [4, "I miss you"], [5, "Come here"]];
const MOODS = [
  ["Happy", "#ffd25a"], ["Loved", "#ff6fa5"], ["Calm", "#6fb7ff"],
  ["Cozy", "#ff9450"], ["Missing you", "#b79cff"], ["Clear", ""],
];
// "#preview": the page as it looks, without the broker (nothing is sent)
const PREVIEW = location.hash === "#preview";
const reduced = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
let me = store.get("ll.me");
let pass = store.get("ll.pass");
let tab = store.get("ll.tab") || "lamp";
let photo = null;   // the JPEG to send (Uint8Array)
const other = () => (me === "A" ? "B" : "A");
// what this phone last told its lamp (the lamp doesn't report back, so it's remembered here)
let lamp = { on: true, c: "#ffb070", br: 110, fx: "solid", mode: "day", mood: "" };
try { Object.assign(lamp, JSON.parse(store.get("ll.lamp") || "{}")); } catch (e) {}
const saveLamp = () => store.set("ll.lamp", JSON.stringify(lamp));

function hexId() {
  const a = new Uint8Array(4);
  crypto.getRandomValues(a);
  return Array.from(a, (x) => x.toString(16).padStart(2, "0")).join("");
}

// ---- the toast: what just happened
let toastTimer = null;
function toast(text, err) {
  const t = $("toast");
  t.textContent = text;
  t.classList.toggle("err", !!err);
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), err ? 4200 : 2400);
}

// ---- the connection: one, while the page is in front of you
let client = null, upState = "down";
function setUp(state) {
  upState = state;
  $("connDot").className = "dot" + (state === "up" ? " up" : state === "trying" ? " trying" : "");
  $("connText").textContent = state === "up" ? "Connected" : state === "trying" ? "Connecting…" : "Not connected";
}
function connect() {
  if (PREVIEW) { setUp("up"); return null; }
  if (client || !me || !pass) return client;
  setUp("trying");
  client = mqtt.connect(BROKER, {
    username: USER, password: pass, clientId: "lamp-page-" + me + "-" + hexId(),
    clean: true, connectTimeout: 15000, reconnectPeriod: 4000, keepalive: 45,
    protocolVersion: 5,   // (so a send the broker refuses comes back as an error, not silence)
  });
  client.on("connect", () => setUp("up"));
  client.on("reconnect", () => setUp("trying"));
  client.on("offline", () => setUp("down"));
  client.on("error", (e) => {
    if (/auth|not authorized|bad user/i.test(String(e && e.message))) {
      toast("That passcode didn't work. Tap your name to enter it again.", true);
      disconnect();
    }
  });
  return client;
}
function disconnect() {
  if (client) client.end(true);
  client = null;
  setUp("down");
}
let hideTimer = null;
document.addEventListener("visibilitychange", () => {
  clearTimeout(hideTimer);
  if (document.hidden) hideTimer = setTimeout(disconnect, 20000);   // (back within 20 s: still connected)
  else if (me && pass) connect();
});

// Publishes `obj` to a lamp's topic; resolves once the broker has it.
function send(to, obj, opts = {}) {
  if (PREVIEW) return new Promise((ok) => setTimeout(ok, 250));
  return new Promise((ok, bad) => {
    const c = connect();
    if (!c) return bad(new Error("not set up"));
    const msg = JSON.stringify(Object.assign({ v: 1, id: hexId(), from: me, ts: Math.floor(Date.now() / 1000) }, obj));
    const timer = setTimeout(() => bad(new Error("timeout")), 20000);
    const go = () => c.publish(`ll/${PAIR}/${to}/photo`, msg,
      { qos: 1, properties: opts.expiry ? { messageExpiryInterval: opts.expiry } : undefined }, (err, packet) => {
        clearTimeout(timer);
        if (err || (packet && packet.reasonCode >= 0x80)) bad(err || new Error("refused " + packet.reasonCode));
        else ok();
      });
    if (c.connected) go(); else c.once("connect", go);
  });
}
// a control for my own lamp: it's dropped if the lamp can't take it within a minute
const control = (obj) => send(me, Object.assign({ t: "ctl" }, obj), { expiry: 60 });
const failed = () => toast("Couldn't reach the lamps. Check the internet and try again.", true);

// ---- the scene: yours on the Lamp tab; theirs, with both pets, for love; theirs for photos
let drift = null;
function setScene(id) {
  document.querySelectorAll(".scene").forEach((s) => s.classList.toggle("on", s.id === "s-" + id));
}
function showScene() {
  clearInterval(drift);
  if (!(me && pass)) {   // first time: the two snuggled up, taking turns
    let w = "B";
    setScene("together-" + w);
    placeScene();
    if (!reduced()) drift = setInterval(() => { w = w === "A" ? "B" : "A"; setScene("together-" + w); placeScene(); }, 7000);
    return;
  }
  setScene(tab === "lamp" ? "dusk-" + me : tab === "love" ? "together-" + other() : "dusk-" + other());
}

// Where each picture's pets are (as fractions of the 960 x 640 render): the
// scene is scaled and placed so they sit in the open "stage" under the lamp or
// the heart (or, with no stage, a little below the middle).
const PETS_AT = { "dusk-A": [.45, .66], "dusk-B": [.6, .68], "together-A": [.37, .72], "together-B": [.53, .72] };
function placeScene() {
  const W = innerWidth, H = innerHeight;
  // (on the Photo tab the pet waits behind the polaroid: the photo's going to its world)
  const stage = document.querySelector(`#setup:not(.hidden) .stage, .panel:not(.hidden) .stage, .panel:not(.hidden) .polaroid`);
  const ty = stage ? stage.getBoundingClientRect().top + window.scrollY + stage.offsetHeight * .5 : H * .55;
  const el = document.querySelector(".scene.on");   // (only the one coming in: the one going keeps its place while it fades)
  if (!el) return;
  const [fx, fy] = PETS_AT[el.id.slice(2)];
  // a picture about two thirds of the screen tall (never narrower than it), its edges fading into the dusk
  const s = Math.max(W / 960, (H * .64) / 640), iw = 960 * s, ih = 640 * s;
  const x = Math.min(0, Math.max(W - iw, W / 2 - fx * iw));
  const y = Math.min(H * .1, Math.max(H * .5 - ih, ty - fy * ih));   // (below it, the dusk)
  Object.assign(el.style, { inset: "auto", left: Math.round(x) + "px", top: Math.round(y) + "px",
                            width: Math.round(iw) + "px", height: Math.round(ih) + "px", backgroundSize: "100% 100%" });
}
addEventListener("resize", () => requestAnimationFrame(placeScene));

function placeThumb(group, value, key) {
  const btns = [...group.querySelectorAll(`[data-${key}]`)];
  const i = btns.findIndex((b) => b.dataset[key] === value);
  const th = group.querySelector(".thumb");
  th.style.width = `calc(${100 / btns.length}% - ${6 / btns.length}px)`;
  th.style.opacity = i < 0 ? 0 : 1;
  if (i >= 0) th.style.transform = `translateX(${i * 100}%)`;
  btns.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset[key] === value)));
}

function showMode() {
  const ready = !!(me && pass);
  document.body.dataset.tab = ready ? tab : "setup";
  $("setup").classList.toggle("hidden", ready);
  $("top").classList.toggle("hidden", !ready);
  $("tabbar").classList.toggle("hidden", !ready);
  ["lamp", "love", "photo"].forEach((t) => {
    $("tab-" + t).classList.toggle("hidden", !ready || t !== tab);
    const b = $("t-" + t);
    b.setAttribute("aria-selected", String(t === tab));
    b.tabIndex = t === tab ? 0 : -1;
  });
  placeThumb($("who"), me || "", "me");
  showScene();
  if (!ready) return;
  $("title").textContent = tab === "lamp" ? `${NAMES[me]}'s lamp` : `For ${NAMES[other()]}`;
  $("whoName").textContent = NAMES[me];
  $("goLabel").textContent = `Send to ${NAMES[other()]}`;
  $("shareLabel").textContent = `Send this glow to ${NAMES[other()]}`;
  $("heartLabel").textContent = `Send ${NAMES[other()]} a heart`;
  $("heartHint").textContent = `Your ${PETS[me]} carries it over`;
  setUp(upState);
  renderLamp();
  renderMood();
  connect();
  requestAnimationFrame(() => { trackGlobe(); placeScene(); });
}

document.querySelectorAll("[data-me]").forEach((b) => b.addEventListener("click", () => { me = b.dataset.me; placeThumb($("who"), me, "me"); }));
$("save").addEventListener("click", () => {
  const p = $("pass").value.trim();
  if (!me) { setStatus("setupStatus", "Choose who you are first.", "err"); return; }
  if (!p) { setStatus("setupStatus", "Enter the lamp passcode.", "err"); $("pass").focus(); return; }
  $("pass").blur();
  pass = p;
  store.set("ll.me", me);
  store.set("ll.pass", pass);
  $("pass").value = "";
  setStatus("setupStatus", "");
  showMode();
});
$("pass").addEventListener("keydown", (e) => { if (e.key === "Enter") $("save").click(); });
$("change").addEventListener("click", () => {
  disconnect();
  store.del("ll.me"); store.del("ll.pass");
  me = null; pass = null; showMode();
});

// ---- the tabs
document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => {
  if (tab === b.dataset.tab) return;
  tab = b.dataset.tab;
  store.set("ll.tab", tab);
  window.scrollTo(0, 0);
  showMode();
}));
$("tabbar").addEventListener("keydown", (e) => {   // arrow keys move between tabs
  const order = ["lamp", "love", "photo"];
  const k = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
  if (!k) return;
  const next = order[(order.indexOf(tab) + k + 3) % 3];
  $("t-" + next).click();
  $("t-" + next).focus();
});

// ---- the Lamp tab
// the globe's light spills over the world from wherever the globe is on screen
function trackGlobe() {
  if (tab !== "lamp") return;
  const r = $("globe").getBoundingClientRect();
  document.documentElement.style.setProperty("--gy", (r.top + r.height / 2) + "px");
}
addEventListener("scroll", () => requestAnimationFrame(trackGlobe), { passive: true });
addEventListener("resize", () => requestAnimationFrame(trackGlobe));

function renderLamp() {
  const root = document.documentElement.style;
  const glow = lamp.mode === "own" ? lamp.c : lamp.mode === "day" ? dayColour() : "#ffb46a";
  root.setProperty("--glow", glow);
  root.setProperty("--level", ((lamp.br - 10) / 245).toFixed(3));
  root.setProperty("--lit", lamp.on ? "1" : "0");
  $("lamp").setAttribute("aria-checked", String(lamp.on));
  $("lamp").dataset.fx = lamp.on && lamp.mode === "own" && !reduced() ? lamp.fx : "";
  const fxName = (EFFECTS.find((e) => e[0] === lamp.fx) || ["", "Steady"])[1];
  $("lampState").textContent = !lamp.on ? "Off"
    : lamp.mode === "day" ? "Following the day" : lamp.mode === "world" ? "Matching the world" : fxName;
  $("lampHint").textContent = lamp.on ? "Tap the globe to turn it off" : "Tap the globe to turn it on";
  const b = $("bright");
  b.value = lamp.br;
  b.style.setProperty("--fill", ((lamp.br - 10) / 245).toFixed(3));
  $("brightVal").textContent = Math.round((lamp.br / 255) * 100) + "%";
  placeThumb($("mode"), lamp.mode, "mode");
  $("modeNote").textContent = lamp.mode === "day"
    ? "Bright white while the sun's up, golden at sunset, warmer and dimmer until bedtime. Pick a colour to choose your own."
    : lamp.mode === "world" ? "The globe takes the colours of the lakeside's time of day. Pick a colour to choose your own."
    : "";
  $("modeNote").classList.toggle("hidden", lamp.mode === "own");
  const own = lamp.mode === "own";
  document.querySelectorAll(".bead[data-c]").forEach((s) =>
    s.setAttribute("aria-pressed", String(own && s.dataset.c.toLowerCase() === lamp.c.toLowerCase())));
  const custom = !COLORS.some((c) => c[1].toLowerCase() === lamp.c.toLowerCase());
  const any = $("anyColour").parentElement;
  any.setAttribute("aria-pressed", String(own && custom));
  if (own && custom) any.style.setProperty("--c", lamp.c);
  document.querySelectorAll(".chip[data-fx]").forEach((c) => c.setAttribute("aria-pressed", String(own && c.dataset.fx === lamp.fx)));
  $("effects").classList.toggle("dim", !own);
}
// roughly what "following the day" looks like right now (the lamp has the real sunset)
function dayColour() {
  const h = new Date().getHours() + new Date().getMinutes() / 60;
  if (h >= 9 && h < 17) return "#ffeedd";
  if (h >= 17 && h < 19.5) return "#ffb86a";
  if (h >= 19.5 && h < 21.5) return "#ff9450";
  if (h >= 7 && h < 9) return "#ffd9b0";
  return "#ff6a28";
}
function setLamp(changes, wire) {
  Object.assign(lamp, changes);
  saveLamp();
  renderLamp();
  return control(wire).catch(failed);
}
const buzz = (p) => { if (navigator.vibrate) navigator.vibrate(p); };

$("lamp").addEventListener("click", () => { buzz(8); setLamp({ on: !lamp.on }, { lamp: !lamp.on }); });

// brightness: the globe follows the finger; the lamp hears it a few times a second, and on letting go
let brTimer = null, brSent = 0;
$("bright").addEventListener("input", (e) => {
  lamp.br = +e.target.value;
  lamp.on = true;
  renderLamp();
  const now = Date.now();
  clearTimeout(brTimer);
  const go = () => { brSent = Date.now(); control({ br: lamp.br, lamp: true }).catch(() => {}); };
  if (now - brSent > 300) go(); else brTimer = setTimeout(go, 300);
});
$("bright").addEventListener("change", () => { clearTimeout(brTimer); saveLamp(); control({ br: lamp.br, lamp: true }).catch(failed); });

document.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => {
  const m = b.dataset.mode;
  setLamp({ mode: m, on: true }, m === "own" ? { c: lamp.c, fx: lamp.fx, lamp: true } : { mode: m, lamp: true });
}));

COLORS.forEach(([name, c]) => {
  const s = document.createElement("button");
  s.type = "button";
  s.className = "bead press";
  s.dataset.c = c;
  s.style.setProperty("--c", c);
  s.setAttribute("aria-label", name);
  s.addEventListener("click", () => {
    const fx = lamp.fx === "aurora" ? "solid" : lamp.fx;
    setLamp({ c, fx, mode: "own", on: true }, { c, fx, lamp: true });
  });
  $("beads").appendChild(s);
});
{
  const s = document.createElement("label");
  s.className = "bead any press";
  s.innerHTML = `<input type="color" id="anyColour" value="#ffb070" aria-label="Any colour">`;
  $("beads").appendChild(s);
  let t = null;
  s.querySelector("input").addEventListener("input", (e) => {   // live while choosing, gently
    const c = e.target.value;
    Object.assign(lamp, { c, mode: "own", on: true, fx: lamp.fx === "aurora" ? "solid" : lamp.fx });
    renderLamp();
    clearTimeout(t);
    t = setTimeout(() => { saveLamp(); control({ c, fx: lamp.fx, lamp: true }).catch(failed); }, 250);
  });
}

EFFECTS.forEach(([fx, name]) => {
  const c = document.createElement("button");
  c.type = "button";
  c.className = "chip press";
  c.dataset.fx = fx;
  c.textContent = name;
  c.addEventListener("click", () => setLamp({ fx, mode: "own", on: true }, { fx, c: lamp.c, lamp: true }));
  $("effects").appendChild(c);
});

$("share").addEventListener("click", () => {
  buzz(10);
  control({ do: "share" }).then(() => toast(`Your glow is on ${NAMES[other()]}'s lamp for a minute`)).catch(failed);
});

// ---- the Love tab
$("heartBtn").addEventListener("click", () => {
  const b = $("heartBtn");
  b.classList.remove("sent");
  void b.offsetWidth;
  b.classList.add("sent");
  buzz([12, 60, 18]);
  const r = b.getBoundingClientRect();
  hearts({ x: r.left + r.width / 2, y: r.top + r.height / 3 }, 8);
  control({ do: "heart" }).then(() => toast(`Heart on its way to ${NAMES[other()]}`)).catch(failed);
});
CODES.forEach(([n, text]) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "code press";
  b.innerHTML = `<span>${text}</span><span class="taps" aria-hidden="true">${Array.from({ length: n }, (_, i) => `<i style="--i:${i}"></i>`).join("")}</span>`;
  b.setAttribute("aria-label", `${text}: ${n} taps on their globe`);
  b.addEventListener("click", () => {
    buzz(Array.from({ length: n * 2 - 1 }, (_, i) => (i % 2 ? 620 : 30)));
    b.classList.remove("playing");
    void b.offsetWidth;
    b.classList.add("playing");
    control({ do: "taps", n }).then(() => toast(`"${text}" on ${NAMES[other()]}'s globe`)).catch(failed);
  });
  $("codes").appendChild(b);
});
function renderMood() {
  document.querySelectorAll(".mood").forEach((m) => m.setAttribute("aria-pressed", String(!!lamp.mood && m.dataset.c === lamp.mood)));
}
MOODS.forEach(([name, c]) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "mood press" + (c ? "" : " clear");
  b.dataset.c = c;
  b.style.setProperty("--c", c || "transparent");
  b.innerHTML = `<i aria-hidden="true"></i>${name}`;
  b.addEventListener("click", () => {
    lamp.mood = c;
    saveLamp();
    renderMood();
    buzz(8);
    control({ do: "mood", c }).then(() => toast(c ? `${NAMES[other()]}'s globe has a touch of ${name.toLowerCase()}` : "Mood cleared")).catch(failed);
  });
  $("moods").appendChild(b);
});

// ---- the Photo tab
function setStatus(id, text, kind) {
  const el = $(id);
  el.textContent = text;
  el.className = "status" + (kind ? " " + kind : "");
}
function showInk() {
  const v = $("caption").value.trim();
  $("ink").textContent = v || "a little note";
  $("ink").classList.toggle("blank", !v);
  $("count").textContent = 80 - $("caption").value.length;
}
$("caption").addEventListener("input", showInk);
$("caption").addEventListener("keydown", (e) => { if (e.key === "Enter" && !$("go").disabled) $("go").click(); });

// the photo, the right way up, fitted inside 480 x 320 (nothing cropped)
$("file").addEventListener("change", async () => {
  const f = $("file").files[0];
  if (!f) return;
  setStatus("status", "Getting it ready…");
  try {
    let src;
    try { src = await createImageBitmap(f, { imageOrientation: "from-image" }); }
    catch (e) {
      src = await new Promise((ok, bad) => {
        const im = new Image();
        im.onload = () => ok(im);
        im.onerror = bad;
        im.src = URL.createObjectURL(f);
      });
    }
    const k = Math.min(480 / src.width, 320 / src.height, 1);
    const w = Math.max(1, Math.round(src.width * k)), h = Math.max(1, Math.round(src.height * k));
    const c = $("canvas");
    c.width = w; c.height = h;
    const g = c.getContext("2d");
    g.imageSmoothingQuality = "high";
    g.drawImage(src, 0, 0, w, h);
    let q = 0.82, blob;
    do {
      blob = await new Promise((ok) => c.toBlob(ok, "image/jpeg", q));
      q -= 0.08;
    } while (blob.size > MAX_BYTES && q > 0.3);
    photo = new Uint8Array(await blob.arrayBuffer());
    $("polaroid").classList.add("has");
    $("go").disabled = false;
    setStatus("status", "");
  } catch (e) {
    setStatus("status", "That photo couldn't be opened. Choose another one.", "err");
  }
});

function b64(bytes) {
  let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}

// sent: the polaroid flies off into their world, toward the pet; hearts rise there
function celebrate() {
  const target = { x: innerWidth * 0.5, y: innerHeight * 0.12 };
  if (reduced()) { hearts({ x: innerWidth / 2, y: innerHeight * .4 }, 3); return; }
  const p = $("polaroid"), r = p.getBoundingClientRect();
  const fly = p.cloneNode(true);
  fly.removeAttribute("id");
  fly.querySelectorAll("[id]").forEach((n) => n.removeAttribute("id"));
  const cv = fly.querySelector("canvas");
  if (cv) { const im = document.createElement("img"); im.src = $("canvas").toDataURL("image/jpeg", .8); im.style.width = "100%"; cv.replaceWith(im); }
  fly.classList.add("flyer");
  Object.assign(fly.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", margin: 0 });
  document.body.appendChild(fly);
  const dx = target.x - (r.left + r.width / 2), dy = target.y - (r.top + r.height / 2);
  const anim = fly.animate([
    { transform: "translate(0, 0) scale(1) rotate(0deg)", opacity: 1 },
    { transform: `translate(${dx * .3}px, ${dy * .45}px) scale(.62) rotate(6deg)`, opacity: 1, offset: .5 },
    { transform: `translate(${dx}px, ${dy}px) scale(.08) rotate(14deg)`, opacity: 0 },
  ], { duration: 1050, easing: "cubic-bezier(.45, 0, .2, 1)" });
  anim.onfinish = () => { fly.remove(); hearts({ x: innerWidth / 2, y: innerHeight * .3 }, 9); };
}
function hearts(at, n) {
  if (reduced()) n = Math.min(n, 3);
  for (let i = 0; i < n; i++) {
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = "♥";
    h.style.left = (at.x - 10 + (Math.random() - .5) * 110) + "px";
    h.style.top = (at.y - 20) + "px";
    h.style.fontSize = (1 + Math.random() * .9) + "rem";
    document.body.appendChild(h);
    const a = h.animate([
      { transform: "translateY(0) scale(.6)", opacity: 0 },
      { transform: "translateY(-30px) scale(1)", opacity: 1, offset: .2 },
      { transform: `translate(${(Math.random() - .5) * 40}px, -${180 + Math.random() * 140}px) scale(1.1)`, opacity: 0 },
    ], { duration: 2300 + Math.random() * 700, delay: i * 110, easing: "cubic-bezier(.2, .7, .3, 1)", fill: "both" });
    a.onfinish = () => h.remove();
  }
}

function busy(on) {
  $("go").classList.toggle("busy", on);
  $("go").disabled = on || !photo;
  $("goLabel").textContent = on ? "Sending…" : `Send to ${NAMES[other()]}`;
}

$("go").addEventListener("click", async () => {
  if (!photo) return;
  busy(true);
  setStatus("status", "");
  const id = hexId();
  const msg = { id, t: "photo", cap: $("caption").value.trim().slice(0, 80), jpg: b64(photo) };
  try {
    await send(other(), msg);
    await send(me, msg);   // a quiet copy for my own lamp's album
    setStatus("status", `On ${NAMES[other()]}'s lamp now`, "ok");
    buzz(14);
    celebrate();
    $("caption").value = "";
    showInk();
  } catch (e) {
    const refused = /refused 135/.test(String(e && e.message));
    setStatus("status", refused ? "The broker isn't letting this login send yet. Check its rules."
                                : "It didn't go through. Check the internet and send it again.", "err");
  }
  busy(false);
});

showMode();
</script>
