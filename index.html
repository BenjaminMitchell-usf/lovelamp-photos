<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Love Lamp Photos</title>
<meta name="description" content="Send a photo to the other love lamp.">
<meta name="theme-color" content="#1b120c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lamp Photos">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
  /* Lamp parchment and walnut; the system font for everything you read or tap,
     Lora (the lamp's own serif) for the one big title. */
  :root {
    --ink: #2b1d13; --ink-2: #6f5948; --ink-3: #9a8574;
    --sheet: rgba(255, 249, 240, .78); --sheet-solid: #fbf3e6;
    --field: #fffdf9; --hairline: rgba(120, 84, 48, .18);
    --accent: #c2185b; --go: #2f6f51; --go-deep: #1f4e39; --gold: #c9a464;
    --radius-sheet: 26px; --radius-ctl: 14px;
    --spring: cubic-bezier(.2, .9, .25, 1);       /* fast out, soft settle: no overshoot */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #1b120c; color: var(--ink);
    font: 500 1.0625rem/1.45 -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }

  /* the world: the other lamp's lakeside and its pet, where the photo will go */
  .world { position: fixed; inset: 0; background-size: cover; opacity: 0; z-index: 0;
           transition: opacity 1.2s ease; }
  .world.on { opacity: 1; }
  #worldA { background-image: url(world-A.jpg); background-position: 46% 85%; }
  #worldB { background-image: url(world-B.jpg); background-position: 61% 85%; }
  .scrim { position: fixed; inset: 0; z-index: 1; pointer-events: none;
           background: linear-gradient(180deg, rgba(18, 10, 4, .62) 0%, rgba(18, 10, 4, .18) 30%, rgba(18, 10, 4, 0) 52%); }

  main {
    position: relative; z-index: 2; max-width: 30rem; margin: 0 auto;
    min-height: 100dvh; display: flex; flex-direction: column;
    padding: max(1.1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) 0 max(1rem, env(safe-area-inset-left));
  }
  header { display: flex; align-items: flex-start; gap: .75rem; padding: .25rem .25rem .9rem; }
  header .text { flex: 1; min-width: 0; }
  h1 { margin: 0; color: #fff9f0; font: 700 2.05rem/1.05 Lora, Georgia, serif; letter-spacing: -.02em;
       text-wrap: balance; text-shadow: 0 1px 18px rgba(0, 0, 0, .5); }
  .lede { margin: .35rem 0 0; color: rgba(255, 244, 228, .86); font-size: .95rem; letter-spacing: .005em;
          text-shadow: 0 1px 10px rgba(0, 0, 0, .55); }

  /* a small material pill: who you are, tap to change */
  .who-pill { flex: none; margin-top: .3rem; border: 0; font: 600 .82rem/1 inherit; color: #fff6ea;
              padding: .5rem .8rem; border-radius: 999px; letter-spacing: .01em;
              background: rgba(30, 18, 10, .38); -webkit-backdrop-filter: blur(14px) saturate(160%);
              backdrop-filter: blur(14px) saturate(160%); box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .25); }

  /* the sheet: one light material over the world, its top edge catching light */
  .sheet {
    background: var(--sheet); border-radius: var(--radius-sheet); padding: 1.1rem;
    -webkit-backdrop-filter: blur(24px) saturate(170%); backdrop-filter: blur(24px) saturate(170%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7), 0 1px 1px rgba(40, 20, 5, .08), 0 18px 44px rgba(20, 10, 2, .38);
    display: flex; flex-direction: column; gap: .9rem;
    animation: materialize .5s var(--spring) both;
  }
  @keyframes materialize { from { opacity: 0; transform: translateY(10px) scale(.985); filter: blur(4px); }
                           to { opacity: 1; transform: none; filter: none; } }
  .eyebrow { margin: 0; font-size: .74rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }

  /* controls: feedback on the press, instantly */
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  .press { transition: transform .1s ease-out, filter .1s ease-out; }
  .press:active { transform: scale(.97); filter: brightness(.96); }
  .primary { width: 100%; min-height: 3.25rem; border-radius: var(--radius-ctl); color: #fffaf2;
             font-weight: 700; font-size: 1.05rem; letter-spacing: .005em;
             background: linear-gradient(180deg, #37805e, var(--go-deep)); box-shadow: 0 6px 16px rgba(31, 78, 57, .32); }
  .primary:disabled { opacity: .45; box-shadow: none; cursor: default; }
  .primary .spin { display: none; width: 1.05rem; height: 1.05rem; margin-right: .5rem; vertical-align: -.17rem;
                   border: 2px solid rgba(255, 255, 255, .45); border-top-color: #fff; border-radius: 50%;
                   animation: spin .8s linear infinite; }
  .primary.busy .spin { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* who's sending: a segmented control, its thumb sliding to the choice */
  .segmented { position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 3px;
               border-radius: 12px; background: rgba(120, 84, 48, .12); }
  .segmented .thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 9px;
                      background: var(--field); box-shadow: 0 1px 2px rgba(40, 20, 5, .14), 0 3px 8px rgba(40, 20, 5, .08);
                      transition: transform .32s var(--spring), opacity .2s; opacity: 0; }
  .segmented[data-on="A"] .thumb, .segmented[data-on="B"] .thumb { opacity: 1; }
  .segmented[data-on="B"] .thumb { transform: translateX(100%); }
  .segmented button { position: relative; z-index: 1; min-height: 2.6rem; font-weight: 600; color: var(--ink-2); }
  .segmented button[aria-pressed="true"] { color: var(--ink); }

  input[type=password], input[type=text] {
    width: 100%; min-height: 3rem; padding: .75rem .9rem; border-radius: var(--radius-ctl);
    border: 1px solid var(--hairline); background: var(--field); color: var(--ink);
    font: 500 1.0625rem/1.2 inherit; outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: rgba(194, 24, 91, .55); box-shadow: 0 0 0 4px rgba(194, 24, 91, .12); }
  .hint { margin: -.35rem 0 0; font-size: .82rem; color: var(--ink-3); }

  /* the photo well: the one big thing on the page; a tap opens the photos */
  .well { position: relative; display: grid; place-items: center; width: 100%; aspect-ratio: 3 / 2;
          border-radius: 18px; overflow: hidden; cursor: pointer;
          background: rgba(120, 84, 48, .08); border: 1.5px dashed rgba(120, 84, 48, .35); }
  .well input { display: none; }
  .well .empty { display: grid; justify-items: center; gap: .45rem; color: var(--ink-2); font-weight: 600; text-align: center; }
  .well .empty svg { width: 2.3rem; height: 2.3rem; color: var(--accent); }
  .well .empty small { font-weight: 500; color: var(--ink-3); font-size: .82rem; }
  .well.has { border: 0; background: #1a120c; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08); }
  .well canvas { display: none; max-width: 100%; max-height: 100%; }
  .well.has canvas { display: block; }
  .well.has .empty { display: none; }
  .well .change { position: absolute; right: .6rem; bottom: .6rem; display: none; padding: .38rem .7rem; border-radius: 999px;
                  font-size: .8rem; font-weight: 600; color: #fff; background: rgba(20, 12, 6, .5);
                  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .well.has .change { display: block; }

  .note-row { position: relative; }
  .note-row .count { position: absolute; right: .8rem; top: 50%; transform: translateY(-50%); font-size: .78rem;
                     color: var(--ink-3); font-variant-numeric: tabular-nums; pointer-events: none; }
  .note-row input { padding-right: 3.2rem; }

  .status { min-height: 1.3rem; margin: -.2rem 0 0; text-align: center; font-size: .9rem; font-weight: 600; color: var(--ink-2); }
  .status.ok { color: var(--go); }
  .status.err { color: var(--accent); }

  .spacer { flex: 1; min-height: 38vh; }   /* the pet, in view below the sheet */
  .hidden { display: none !important; }

  /* sent: the photo flies down into the world to the pet, and hearts rise there */
  .flyer { position: fixed; z-index: 5; pointer-events: none; border-radius: 6px; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
  .heart { position: fixed; z-index: 4; pointer-events: none; color: #ff7aa8; font-size: 1.5rem;
           text-shadow: 0 0 14px rgba(255, 111, 165, .9); }

  @media (prefers-reduced-transparency: reduce) {
    .sheet { background: var(--sheet-solid); -webkit-backdrop-filter: none; backdrop-filter: none; }
    .who-pill, .well .change { background: rgba(30, 18, 10, .85); -webkit-backdrop-filter: none; backdrop-filter: none; }
  }
  @media (prefers-contrast: more) {
    .sheet { background: var(--sheet-solid); box-shadow: 0 0 0 1.5px var(--ink); }
    input { border-color: var(--ink-2); }
  }
  @media (prefers-reduced-motion: reduce) {
    .world { transition: opacity .3s; }
    .sheet { animation: fade .25s ease both; }
    .segmented .thumb { transition: opacity .2s; }
    .press:active { transform: none; }
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
<div class="world" id="worldA" aria-hidden="true"></div>
<div class="world" id="worldB" aria-hidden="true"></div>
<div class="scrim" aria-hidden="true"></div>
<main>
  <header>
    <div class="text">
      <h1 id="title">Send a photo to the lamp</h1>
      <p class="lede" id="lede">It appears on the other lamp in a moment.</p>
    </div>
    <button type="button" class="who-pill press hidden" id="change" aria-label="Change who's sending">Benji</button>
  </header>

  <!-- once per phone: who's sending, and the passcode -->
  <section class="sheet" id="setup" aria-labelledby="setupLabel">
    <p class="eyebrow" id="setupLabel">Who's sending</p>
    <div class="segmented" id="who" role="group" aria-label="Who's sending">
      <span class="thumb" aria-hidden="true"></span>
      <button type="button" data-me="A" aria-pressed="false">Benji</button>
      <button type="button" data-me="B" aria-pressed="false">Julie</button>
    </div>
    <p class="eyebrow"><label for="pass">Photo passcode</label></p>
    <input id="pass" type="password" autocomplete="current-password" placeholder="Passcode" enterkeyhint="done">
    <p class="hint">Asked once. This phone remembers it.</p>
    <button type="button" class="primary press" id="save">Continue</button>
    <p class="status" id="setupStatus" role="status"></p>
  </section>

  <!-- then: a photo, a little note, send -->
  <section class="sheet hidden" id="send" aria-label="Send a photo">
    <label class="well press" id="well">
      <input id="file" type="file" accept="image/*">
      <span class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="8.5" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/>
        </svg>
        Choose a photo
        <small>It's fitted to the lamp's screen</small>
      </span>
      <canvas id="canvas" width="480" height="320" aria-label="Your photo"></canvas>
      <span class="change">Change</span>
    </label>
    <div class="note-row">
      <input id="caption" type="text" maxlength="80" placeholder="Add a little note" enterkeyhint="send" aria-label="A little note">
      <span class="count" id="count">80</span>
    </div>
    <button type="button" class="primary press" id="go" disabled><span class="spin" aria-hidden="true"></span><span id="goLabel">Send</span></button>
    <p class="status" id="status" role="status"></p>
  </section>

  <div class="spacer"></div>
</main>

<script>
// Love Lamp photo page.  The photo goes to the OTHER person's lamp (and a
// quiet copy to your own, so both keep the whole album): fitted to the lamp's
// screen (480 x 320), a JPEG under ~60 KB, sent through the lamps' broker
// (MQTT over secure WebSocket) to their photo topics.  The page holds no
// password: the passcode is asked once and kept on this phone.
const BROKER = "wss://w7f280b2.ala.us-east-1.emqxsl.com:8084/mqtt";
const PAIR = "ll-41205afa9e";
const USER = "lamp-photos";
const NAMES = { A: "Benji", B: "Julie" };
const PETS = { A: "pup", B: "kitten" };
const MAX_BYTES = 60000;
const reduced = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
let me = store.get("ll.me");
let pass = store.get("ll.pass");
let photo = null;   // the JPEG to send (Uint8Array)
const other = () => (me === "A" ? "B" : "A");

// ---- the world behind: theirs once we know who you are; before, the two take turns
let drift = null;
function setWorld(id) {
  $("worldA").classList.toggle("on", id === "A");
  $("worldB").classList.toggle("on", id === "B");
}
function showWorld() {
  clearInterval(drift);
  if (me) { setWorld(other()); return; }
  let w = "B";
  setWorld(w);
  if (!reduced()) drift = setInterval(() => { w = w === "A" ? "B" : "A"; setWorld(w); }, 6000);
}

function showMode() {
  showWorld();
  const ready = !!(me && pass);
  $("setup").classList.toggle("hidden", ready);
  $("send").classList.toggle("hidden", !ready);
  $("change").classList.toggle("hidden", !ready);
  if (ready) {
    $("title").textContent = `For ${NAMES[other()]}`;
    $("lede").textContent = `A photo for ${NAMES[other()]}'s lamp, by the ${PETS[other()]}.`;
    $("change").textContent = `${NAMES[me]} · Change`;
    $("goLabel").textContent = `Send to ${NAMES[other()]}`;
  } else {
    $("title").textContent = "Send a photo to the lamp";
    $("lede").textContent = "First, who's this?";
  }
  $("who").dataset.on = me || "";
  document.querySelectorAll("[data-me]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.me === me)));
}

document.querySelectorAll("[data-me]").forEach((b) =>
  b.addEventListener("click", () => { me = b.dataset.me; showMode(); }));

$("save").addEventListener("click", () => {
  const p = $("pass").value.trim();
  if (!me) { setStatus("setupStatus", "Choose who's sending first.", "err"); return; }
  if (!p) { setStatus("setupStatus", "Enter the photo passcode.", "err"); $("pass").focus(); return; }
  pass = p;
  store.set("ll.me", me);
  store.set("ll.pass", pass);
  $("pass").value = "";
  setStatus("setupStatus", "");
  showMode();
});
$("pass").addEventListener("keydown", (e) => { if (e.key === "Enter") $("save").click(); });

$("change").addEventListener("click", () => {
  store.del("ll.me"); store.del("ll.pass");
  me = null; pass = null; showMode();
});

function setStatus(id, text, kind) {
  const el = $(id);
  el.textContent = text;
  el.className = "status" + (kind ? " " + kind : "");
}

$("caption").addEventListener("input", () => { $("count").textContent = 80 - $("caption").value.length; });
$("caption").addEventListener("keydown", (e) => { if (e.key === "Enter" && !$("go").disabled) $("go").click(); });

// ---- the photo, the right way up, fitted inside 480 x 320 (nothing cropped)
$("file").addEventListener("change", async () => {
  const f = $("file").files[0];
  if (!f) return;
  setStatus("status", "Getting it ready…");
  try {
    let src;
    try { src = await createImageBitmap(f, { imageOrientation: "from-image" }); }
    catch (e) {
      src = await new Promise((ok, bad) => {
        const im = new Image();
        im.onload = () => ok(im);
        im.onerror = bad;
        im.src = URL.createObjectURL(f);
      });
    }
    const k = Math.min(480 / src.width, 320 / src.height, 1);
    const w = Math.max(1, Math.round(src.width * k)), h = Math.max(1, Math.round(src.height * k));
    const c = $("canvas");
    c.width = w; c.height = h;
    const g = c.getContext("2d");
    g.imageSmoothingQuality = "high";
    g.drawImage(src, 0, 0, w, h);
    let q = 0.82, blob;
    do {
      blob = await new Promise((ok) => c.toBlob(ok, "image/jpeg", q));
      q -= 0.08;
    } while (blob.size > MAX_BYTES && q > 0.3);
    photo = new Uint8Array(await blob.arrayBuffer());
    $("well").classList.add("has");
    $("go").disabled = false;
    setStatus("status", "");
  } catch (e) {
    setStatus("status", "That photo couldn't be opened. Try another?", "err");
  }
});

function b64(bytes) {
  let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
function hexId() {
  const a = new Uint8Array(4);
  crypto.getRandomValues(a);
  return Array.from(a, (x) => x.toString(16).padStart(2, "0")).join("");
}

// ---- sent: the photo flies down into their world, toward the pet; hearts rise there
function celebrate() {
  const target = { x: innerWidth * 0.5, y: innerHeight * 0.8 };   // the pet's spot on the dock
  if (reduced()) { hearts(target, 5); return; }
  const c = $("canvas"), r = c.getBoundingClientRect();
  const fly = document.createElement("img");
  fly.className = "flyer";
  fly.src = c.toDataURL("image/jpeg", 0.8);
  Object.assign(fly.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px" });
  document.body.appendChild(fly);
  const dx = target.x - (r.left + r.width / 2), dy = target.y - (r.top + r.height / 2);
  const anim = fly.animate([
    { transform: "translate(0, 0) scale(1) rotate(0deg)", opacity: 1 },
    { transform: `translate(${dx * 0.55}px, ${dy * 0.4}px) scale(.55) rotate(-4deg)`, opacity: 1, offset: 0.55 },
    { transform: `translate(${dx}px, ${dy}px) scale(.12) rotate(-8deg)`, opacity: 0 },
  ], { duration: 900, easing: "cubic-bezier(.4, 0, .2, 1)" });
  anim.onfinish = () => { fly.remove(); hearts(target, 9); };
}
function hearts(at, n) {
  for (let i = 0; i < n; i++) {
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = "♥";
    h.style.left = (at.x - 10 + (Math.random() - 0.5) * 90) + "px";
    h.style.top = (at.y - 20) + "px";
    document.body.appendChild(h);
    const a = h.animate([
      { transform: "translateY(0) scale(.6)", opacity: 0 },
      { transform: "translateY(-30px) scale(1)", opacity: 1, offset: 0.2 },
      { transform: `translateY(-${180 + Math.random() * 120}px) scale(1.1)`, opacity: 0 },
    ], { duration: 2200 + Math.random() * 600, delay: i * 110, easing: "cubic-bezier(.2, .7, .3, 1)", fill: "both" });
    a.onfinish = () => h.remove();
  }
}

function busy(on) {
  $("go").classList.toggle("busy", on);
  $("go").disabled = on || !photo;
  $("goLabel").textContent = on ? "Sending…" : `Send to ${NAMES[other()]}`;
}

$("go").addEventListener("click", () => {
  if (!photo) return;
  busy(true);
  setStatus("status", "");
  const msg = JSON.stringify({
    v: 1, id: hexId(), t: "photo", from: me, ts: Math.floor(Date.now() / 1000),
    cap: $("caption").value.trim().slice(0, 80), jpg: b64(photo),
  });
  const client = mqtt.connect(BROKER, {
    username: USER, password: pass, clientId: "lamp-photos-" + hexId(),
    clean: true, connectTimeout: 15000, reconnectPeriod: 0,
  });
  let done = false;
  const finish = (text, kind) => {
    if (done) return;
    done = true;
    busy(false);
    setStatus("status", text, kind);
    client.end(true);
  };
  client.on("connect", () => {
    client.publish(`ll/${PAIR}/${other()}/photo`, msg, { qos: 1 }, (err) => {
      if (err) { finish("It didn't go through. Try again?", "err"); return; }
      // and a quiet copy for my own lamp, so both lamps keep the whole album
      client.publish(`ll/${PAIR}/${me}/photo`, msg, { qos: 1 }, () => {
        finish(`On ${NAMES[other()]}'s lamp now.`, "ok");
        if (navigator.vibrate) navigator.vibrate(12);
        celebrate();
        $("caption").value = "";
        $("count").textContent = 80;
      });
    });
  });
  client.on("error", (e) => {
    const bad = /auth|not authorized|bad user/i.test(String(e && e.message));
    finish(bad ? "That passcode didn't work. Tap your name above to enter it again." :
                 "Couldn't reach the lamps. Check the internet and try again.", "err");
  });
  setTimeout(() => finish("Couldn't reach the lamps. Check the internet and try again.", "err"), 25000);
});

showMode();
</script>
</body>
</html>
